name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: OpenAPI drift check
        run: pnpm run check:openapi

      # Docker is preinstalled on GitHub-hosted ubuntu runners; the seam-1
      # rig (packages/control-plane) boots its own throwaway Postgres via
      # testcontainers, so no `services:` container is declared here.
      - name: Test
        run: pnpm run test
