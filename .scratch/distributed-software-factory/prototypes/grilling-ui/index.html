<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype 17 — Grilling Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Token Corpus — diangkat dari lexicon/frontend/packages/design-system.
   Yang dipakai di sini saja; nama dan nilainya tidak diubah.
   ========================================================================= */
:root{
  --neutral-0:#ffffff; --neutral-1:#f6f8fa; --neutral-2:#eff2f5; --neutral-3:#e6eaef;
  --neutral-6:#d1d9e0; --neutral-7:#c8d1da; --neutral-8:#818b98; --neutral-9:#59636e;
  --neutral-10:#454c54; --neutral-11:#393f46; --neutral-12:#25292e; --neutral-13:#1f2328;
  --blue-1:#b6e3ff; --blue-3:#54aeff; --blue-5:#0969da; --blue-8:#0a3069;
  --green-3:#4ac26b; --green-5:#1a7f37;
  --red-0:#ffebe9; --red-4:#fa4549; --red-5:#cb0b19; --red-8:#660018;
  --yellow-3:#fec511; --yellow-5:#cd8401;
  --purple-0:#fbefff; --purple-2:#d8b9ff; --purple-4:#a475f9; --purple-5:#8250df; --purple-8:#3e1f79;
  --teal-4:#2fe0e1; --teal-7:#0097ac; --teal-9:#003d46;

  --radius:0.875rem;
  --radius-sm:calc(var(--radius) * 0.6);
  --radius-md:calc(var(--radius) * 0.8);
  --radius-lg:var(--radius);
  --radius-xl:calc(var(--radius) * 1.4);

  --fs-xs:0.75rem; --fs-sm:0.875rem; --fs-base:1rem;
  --fs-lg:1.125rem; --fs-xl:1.25rem; --fs-2xl:1.5rem;
  --tracking-tight:-0.025em; --tracking-tighter:-0.05em;

  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --display:"Rethink Sans",var(--sans);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.16,.84,.44,1);
  --dur:.18s;
}
/* ---- light (Corpus :root) ---- */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f8fafc; --paper:#ffffff; --panel:#ffffff; --sunk:#f1f5f9;
  --fg:#020618; --fg-2:#45525f; --fg-3:#64748b;
  --border:#e2e8f0; --border-2:#cbd5e1;
  --primary:#009689; --primary-fg:#f8fafc; --ring:#009689;
  --info:var(--blue-5); --info-wash:#eef6ff; --info-line:#b6e3ff;
  --attention:var(--purple-5); --attention-wash:#faf2ff; --attention-line:#d8b9ff;
  --success:var(--green-5); --warning:var(--yellow-5);
  --destructive:#e7000b; --destructive-wash:#fff5f4; --destructive-line:#ffcecb;
  --shadow-xs:0 1px 2px 0 rgb(2 6 24 / .05);
  --shadow-sm:0 1px 3px 0 rgb(2 6 24 / .09), 0 1px 2px -1px rgb(2 6 24 / .07);
  --shadow-md:0 4px 6px -1px rgb(2 6 24 / .08), 0 2px 4px -2px rgb(2 6 24 / .06);
  --shadow-lg:0 10px 15px -3px rgb(2 6 24 / .10), 0 4px 6px -4px rgb(2 6 24 / .08);
}
/* ---- dark (Corpus .dark) ---- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1f2328; --paper:#25292e; --panel:#25292e; --sunk:#1a1d21;
  --fg:#f6f8fa; --fg-2:#c8d1da; --fg-3:#97a1ad;
  --border:#454c54; --border-2:#5a626b;
  --primary:#2fe0e1; --primary-fg:#003d46; --ring:#2fe0e1;
  --info:var(--blue-3); --info-wash:#16263a; --info-line:#284b73;
  --attention:var(--purple-4); --attention-wash:#241c37; --attention-line:#4a3a75;
  --success:var(--green-3); --warning:var(--yellow-3);
  --destructive:#fa4549; --destructive-wash:#341a1c; --destructive-line:#68282c;
  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .30);
  --shadow-sm:0 1px 3px 0 rgb(0 0 0 / .40), 0 1px 2px -1px rgb(0 0 0 / .35);
  --shadow-md:0 4px 6px -1px rgb(0 0 0 / .45), 0 2px 4px -2px rgb(0 0 0 / .35);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .55), 0 4px 6px -4px rgb(0 0 0 / .40);
}

/* ========================================================================= */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-bottom:3.5rem;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:var(--fs-sm);line-height:1.55;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
h1,h2,h3,.display{font-family:var(--display);letter-spacing:var(--tracking-tight)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.fg2{color:var(--fg-2)} .fg3{color:var(--fg-3)}
.row{display:flex;align-items:center;gap:.625rem}
.ic{flex:none;vertical-align:-2px}
.dot{width:3px;height:3px;border-radius:50%;background:var(--border-2);flex:none}
.sp{flex:1}
[hidden]{display:none !important}

/* ---------------- controls ---------------- */
button{font:inherit;font-family:var(--sans);color:var(--fg);background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:.375rem .75rem;
  cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;font-weight:500;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),
    color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
button:hover{border-color:var(--border-2);background:var(--sunk)}
button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);
  font-weight:600;box-shadow:var(--shadow-xs)}
button.primary:hover{filter:brightness(1.08);border-color:var(--primary)}
button.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
button.ghost:hover{background:var(--sunk);color:var(--fg)}
button.danger{background:transparent;border-color:transparent;color:var(--destructive)}
button.danger:hover{background:var(--destructive-wash);border-color:var(--destructive-line)}
button.sm{padding:.25rem .5rem;font-size:var(--fs-xs)}
.iconbtn{padding:.375rem;border-radius:var(--radius-sm)}

.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:.25rem .625rem;border-radius:calc(var(--radius-sm) - 2px);
  color:var(--fg-3);font-size:var(--fs-xs);font-weight:500}
.seg button:hover{background:transparent;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow-xs)}

.chip{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--border);
  border-radius:999px;padding:.075rem .5rem;font-size:var(--fs-xs);color:var(--fg-3);
  background:var(--panel);font-weight:500;white-space:nowrap}
.chip.att{border-color:var(--attention-line);color:var(--attention);background:var(--attention-wash)}
.chip.inf{border-color:var(--info-line);color:var(--info);background:var(--info-wash)}
.kbd{flex:none;min-width:1.25rem;height:1.25rem;padding:0 .25rem;border-radius:calc(var(--radius-sm) - 2px);
  background:var(--sunk);border:1px solid var(--border);display:grid;place-items:center;
  font-family:var(--mono);font-size:.6875rem;font-weight:600;color:var(--fg-3)}

/* ---------------- shell ---------------- */
.app{min-height:calc(100dvh - 3.5rem);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:1rem;padding:0 1rem;height:3rem;flex:none;
  background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.brand{flex:none;display:flex;align-items:center;gap:.5rem;font-family:var(--display);
  font-weight:700;letter-spacing:var(--tracking-tight)}
.brand .sq{width:1rem;height:1rem;border-radius:calc(var(--radius-sm) - 3px);
  background:var(--primary);box-shadow:var(--shadow-xs)}
.crumbs{display:flex;align-items:center;gap:.4rem;color:var(--fg-3);font-size:var(--fs-xs);
  min-width:0;overflow:hidden;white-space:nowrap}
.crumbs b{color:var(--fg);font-weight:600} .crumbs .s{opacity:.5}
@media (max-width:820px){.crumbs{display:none}}

.head{padding:1.25rem 1rem .25rem;max-width:110rem}
.head h1{font-size:var(--fs-2xl);line-height:1.2;margin:0;font-weight:700}
.meta{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;margin-top:.4rem;
  font-size:var(--fs-xs);color:var(--fg-3)}
.meta b{color:var(--fg-2);font-weight:600}

/* ---------------- return marker (q4) ---------------- */
.marker{margin:1rem 1rem 0;border:1px solid var(--attention-line);background:var(--attention-wash);
  border-radius:var(--radius-md);padding:.875rem 1rem;display:flex;gap:.875rem;align-items:flex-start;
  box-shadow:var(--shadow-xs)}
.marker .ico{color:var(--attention);flex:none;margin-top:1px}
.marker .t{flex:1;min-width:0;font-size:var(--fs-sm)}
.marker .t b{font-weight:600}
.marker .s{color:var(--fg-2);margin-top:.15rem;font-size:var(--fs-xs);line-height:1.5}
.digest{margin-top:.625rem;display:flex;gap:.5rem;flex-wrap:wrap}
.digest .d{display:flex;align-items:baseline;gap:.375rem;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:.3rem .6rem;font-size:var(--fs-xs)}
.digest .d b{font-family:var(--display);font-size:var(--fs-base);font-weight:700;color:var(--fg)}

/* ---------------- split ---------------- */
.split{display:grid;gap:0;margin:1rem 1rem 0;border:1px solid var(--border);
  border-radius:var(--radius-lg);background:var(--panel);overflow:hidden;
  box-shadow:var(--shadow-sm);flex:1 1 0;min-height:26rem;margin-bottom:1rem}
.split.side{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.split.draft{grid-template-columns:minmax(0,22rem) minmax(0,1fr)}
.split.over{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.split.tab{grid-template-columns:minmax(0,1fr)}
.split.rail3.side{grid-template-columns:minmax(0,1fr) 15rem minmax(0,1fr)}
.split.rail3.draft{grid-template-columns:minmax(0,20rem) 14rem minmax(0,1fr)}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--panel)}
.pane+.pane{border-left:1px solid var(--border)}
.split.over .pane+.pane{border-left:0;border-top:1px solid var(--border)}
@media (max-width:1080px){
  .split{display:block;flex:none;min-height:0}
  .pane{max-height:34rem}
  .pane+.pane{border-left:0;border-top:1px solid var(--border)}
}
.panehd{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex:none;
  padding:.625rem .875rem;background:var(--panel);border-bottom:1px solid var(--border);
  font-size:var(--fs-xs);color:var(--fg-3);font-weight:500;min-height:2.75rem}
.panebody{overflow:auto;overscroll-behavior:contain;flex:1;min-height:0;scrollbar-width:thin}

/* ---------------- conversation ---------------- */
.conv{padding:1rem .875rem .5rem}
.turn{margin-bottom:1.125rem;position:relative}
.turn:hover .rw{opacity:1}
.thd{display:flex;align-items:center;gap:.5rem;font-size:var(--fs-xs);color:var(--fg-3);
  margin-bottom:.3rem;flex-wrap:wrap}
.thd .who{font-weight:700;font-size:var(--fs-xs);color:var(--fg-2);letter-spacing:.01em}
.thd .who.agent{color:var(--info)} .thd .who.human{color:var(--attention)}
.rw{opacity:0;transition:opacity var(--dur) var(--ease);margin-left:auto}
.rw button{font-size:var(--fs-xs);padding:.15rem .45rem}
@media (hover:none){.rw{opacity:1}}
.bubble{border-radius:var(--radius-md);padding:.625rem .8rem;font-size:var(--fs-sm);
  line-height:1.6;max-width:62ch;border:1px solid var(--border);background:var(--sunk)}
.bubble.agent{background:var(--panel);border-color:var(--border)}
.bubble.human{background:var(--sunk);border-color:var(--border)}
.bubble.byhand{background:var(--attention-wash);border-color:var(--attention-line)}
.bubble.sys{background:transparent;border-style:dashed;color:var(--fg-2);max-width:none;
  display:flex;align-items:center;gap:.5rem;font-size:var(--fs-xs);padding:.5rem .7rem}
.bubble.live{border-color:var(--info-line);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 12%,transparent)}
.fold{width:100%;justify-content:flex-start;margin-bottom:1.125rem;background:transparent;
  border-style:dashed;color:var(--fg-3);font-size:var(--fs-xs);font-weight:500}
.fold:hover{background:var(--sunk);color:var(--fg-2)}
.fold.on{border-style:solid;color:var(--fg-2)}
.daybreak{display:flex;align-items:center;gap:.625rem;margin:1.25rem 0;color:var(--fg-3);
  font-size:var(--fs-xs);letter-spacing:.03em;font-weight:500}
.daybreak::before,.daybreak::after{content:"";flex:1;height:1px;background:var(--border)}
.choices{display:flex;flex-direction:column;gap:.4rem;margin-top:.75rem}
.choice{display:flex;align-items:flex-start;gap:.55rem;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:.55rem .65rem;background:var(--panel);cursor:pointer;
  text-align:left;color:inherit;width:100%;font-weight:400}
.choice:hover{border-color:var(--primary);background:var(--sunk)}
.choice b{display:block;font-size:var(--fs-sm);font-weight:600;margin-bottom:.05rem}
.choice span.d{display:block;font-size:var(--fs-xs);color:var(--fg-3);line-height:1.45}
.approve{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap;align-items:center}

/* agent bekerja */
.busy{margin:.5rem 0 0;border:1px solid var(--info-line);background:var(--info-wash);
  border-radius:var(--radius-md);padding:.75rem .875rem;max-width:62ch}
.busy .bt{display:flex;align-items:center;gap:.5rem;font-size:var(--fs-xs);color:var(--info);
  font-weight:600;margin-bottom:.5rem}
.busy .el{margin-left:auto;font-family:var(--mono);color:var(--fg-2);font-weight:500}
.bstep{display:flex;align-items:center;gap:.5rem;font-size:var(--fs-xs);color:var(--fg-3);
  padding:.2rem 0}
.bstep .bx{width:.75rem;height:.75rem;border-radius:50%;border:1.5px solid var(--border-2);flex:none}
.bstep.on{color:var(--fg)} .bstep.on .bx{border-color:var(--info);
  background:radial-gradient(circle,var(--info) 40%,transparent 42%);animation:pulse 1s infinite}
.bstep.done{color:var(--fg-2)} .bstep.done .bx{border-color:var(--success);background:var(--success)}
@keyframes pulse{50%{opacity:.4}}
.busy .note{margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--info-line);
  font-size:var(--fs-xs);color:var(--fg-2);line-height:1.5}

/* ---------------- composer ---------------- */
.composer{flex:none;border-top:1px solid var(--border);background:var(--panel);padding:.75rem .875rem}
textarea{width:100%;min-height:4rem;max-height:11rem;background:var(--sunk);color:var(--fg);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:.55rem .7rem;
  font-family:var(--sans);font-size:var(--fs-sm);line-height:1.55;resize:vertical}
textarea::placeholder{color:var(--fg-3)}
textarea:focus{outline:2px solid var(--ring);outline-offset:-1px;border-color:transparent}
.cmpfoot{display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  margin-top:.625rem;flex-wrap:wrap}
.cmphint{font-size:var(--fs-xs);color:var(--fg-3);display:flex;align-items:center;gap:.4rem;
  flex-wrap:wrap}
.cmphint b{color:var(--fg-2);font-weight:600}
.locked{display:flex;align-items:center;gap:.5rem;font-size:var(--fs-xs);color:var(--fg-3);
  border:1px dashed var(--border);border-radius:var(--radius-sm);padding:.5rem .7rem}

/* ---------------- draft ---------------- */
.revbar{display:flex;align-items:center;gap:.375rem;flex-wrap:wrap;padding:.625rem .875rem;
  border-bottom:1px solid var(--border);background:var(--panel);flex:none}
.rev{border:1px solid var(--border);background:var(--panel);border-radius:999px;
  padding:.15rem .55rem;font-size:var(--fs-xs);color:var(--fg-3);font-weight:500}
.rev[aria-pressed="true"]{background:var(--sunk);border-color:var(--border-2);color:var(--fg)}
.rev.human{border-color:var(--attention-line);color:var(--attention)}
.rev.human[aria-pressed="true"]{background:var(--attention-wash)}
.rev .dotm{width:.375rem;height:.375rem;border-radius:50%;background:currentColor;opacity:.8}

.paperwrap{background:var(--bg);flex:1;min-height:0;overflow:auto}
.doc{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-md);
  margin:.875rem auto;padding:1.5rem 1.75rem 2.5rem;max-width:68ch;box-shadow:var(--shadow-xs)}
.doc .stamp{display:flex;align-items:center;gap:.5rem;font-size:var(--fs-xs);color:var(--fg-3);
  margin-bottom:1rem;flex-wrap:wrap}
.doc h1{font-size:var(--fs-xl);margin:0 0 .125rem;font-weight:700}
.doc h2{font-family:var(--sans);font-size:var(--fs-xs);margin:1.5rem 0 .5rem;color:var(--fg-3);
  text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.doc h2:first-of-type{margin-top:1.25rem}
.doc p,.doc li{color:var(--fg-2);line-height:1.7;font-size:var(--fs-sm)}
.doc p{margin:0 0 .625rem}
.doc ul{margin:0 0 .625rem;padding-left:1.15rem}
.doc li{margin-bottom:.3rem}
.doc b{color:var(--fg);font-weight:600}
.sec{position:relative;border-radius:var(--radius-sm)}
.sec .ed{position:absolute;top:.2rem;right:-.25rem;opacity:0;transition:opacity var(--dur) var(--ease)}
.sec:hover .ed{opacity:1}
.sec.editing{background:var(--sunk);box-shadow:0 0 0 .5rem var(--sunk),inset 0 0 0 1px var(--border-2)}
.ins{background:color-mix(in srgb,var(--success) 14%,transparent);border-radius:3px;
  box-shadow:-3px 0 0 color-mix(in srgb,var(--success) 14%,transparent),
              3px 0 0 color-mix(in srgb,var(--success) 14%,transparent)}
.ins-h{background:color-mix(in srgb,var(--attention) 16%,transparent);border-radius:3px;
  box-shadow:-3px 0 0 color-mix(in srgb,var(--attention) 16%,transparent),
              3px 0 0 color-mix(in srgb,var(--attention) 16%,transparent)}
.reveal{animation:reveal .5s var(--ease) both}
@keyframes reveal{from{filter:blur(3px);opacity:.35}to{filter:blur(0);opacity:1}}
.attr{display:inline-flex;align-items:center;gap:.25rem;font-size:var(--fs-xs);
  color:var(--attention);margin-left:.35rem;vertical-align:1px;font-weight:500}
.band{display:flex;align-items:flex-start;gap:.5rem;margin:0 0 1rem;padding:.55rem .7rem;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--sunk);
  font-size:var(--fs-xs);color:var(--fg-2);line-height:1.5}
.band.att{border-color:var(--attention-line);background:var(--attention-wash)}
.band .ico{flex:none;margin-top:1px;color:var(--fg-3)}
.band.att .ico{color:var(--attention)}
.edbox{margin:.5rem 0 0}
.edbox textarea{min-height:5rem;background:var(--paper)}

/* ---------------- decisions ---------------- */
.dec{padding:.875rem}
.decrow{display:grid;grid-template-columns:1fr auto;gap:.625rem;align-items:baseline;
  padding:.55rem .7rem;border:1px solid var(--border);border-radius:var(--radius-sm);
  margin-bottom:.375rem;background:var(--panel);cursor:pointer;width:100%;text-align:left;
  font-weight:400}
.decrow:hover{border-color:var(--border-2);background:var(--sunk)}
.decrow.human{border-color:var(--attention-line);background:var(--attention-wash)}
.decrow .q{font-size:var(--fs-xs);color:var(--fg-3);margin-bottom:.1rem}
.decrow .a{font-weight:600;font-size:var(--fs-sm);color:var(--fg)}
.decrow .t{font-size:var(--fs-xs);color:var(--fg-3);white-space:nowrap;font-family:var(--mono)}
.railcol .dec{padding:.5rem}
.railcol .decrow{grid-template-columns:1fr;gap:.1rem;padding:.45rem .55rem;margin-bottom:.3rem}
.railcol .decrow .q{line-height:1.35}
.railcol .decrow .a{font-size:var(--fs-xs);line-height:1.4}
.railcol .decrow .t{margin-top:.15rem;font-size:.6875rem}
.searchbox{display:flex;align-items:center;gap:.5rem;padding:.5rem .875rem;flex:none;
  border-bottom:1px solid var(--border);color:var(--fg-3)}
.searchbox input{flex:1;background:transparent;border:0;color:var(--fg);font:inherit;
  font-size:var(--fs-xs);outline:none;min-width:0}
.searchbox input::placeholder{color:var(--fg-3)}

/* ---------------- inbox ---------------- */
.page{max-width:60rem;margin:0 auto;padding:1.5rem 1rem 3rem;width:100%}
.page h1{font-size:var(--fs-2xl);margin:0 0 .125rem;font-weight:700}
.inboxrow{display:flex;align-items:center;justify-content:space-between;gap:1.25rem;
  padding:.875rem;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--panel);margin-bottom:.5rem;cursor:pointer;width:100%;text-align:left;
  font-weight:400;box-shadow:var(--shadow-xs)}
.inboxrow:hover{border-color:var(--border-2);background:var(--panel);box-shadow:var(--shadow-sm)}

function buildLong(){
  const T=[],D=[],R=[];
  let hh=9, mm=5, day=0, f=0;
  const stamp=()=>{ mm+=7+((f*13)%23); if(mm>=60){mm-=60;hh++;}
    if(hh>=18){hh=8;mm=12;day=Math.min(day+1,3);}
    return (hh<10?"0":"")+hh+":"+(mm<10?"0":"")+mm; };
  for(let n=1;n<=79;n++){
    const pair=FILL[f%FILL.length]; f++;
    const humanEdit = (n===23||n===52);
    const at1=stamp();
    if(humanEdit){
      const who = n===23?"rangga":"dita";
      const what = n===23?"Menambahkan bagian Batasan: maksimum 100 item per cart."
                        :"Mengubah SLA pembayaran dari 30 menjadi 45 menit di bagian Batasan.";
      T.push({n,who:"human",d:day,at:at1,by:who,kind:"edit",text:what});
      T.push({n:n+1,who:"agent",d:day,at:at1,text:n===23
        ?"Saya lihat kamu menambahkan batas 100 item. Apa yang terjadi kalau cart melebihi itu — ditolak, atau dipotong?"
        :"Kamu menaikkan SLA jadi 45 menit. Stok tetap dilepas di menit ke-30 atau ikut naik?"});
      T.push({n:n+1,who:"human",d:day,at:stamp(),by:who,text:n===23?"Ditolak dengan 422.":"Ikut naik. Satu angka saja."});
      D.push({turn:n,q:n===23?"Batas ukuran cart":"SLA pembayaran",a:n===23?"100 item":"45 menit",human:true});
      D.push({turn:n+1,q:n===23?"Perilaku saat melebihi batas":"Pelepasan stok",a:n===23?"Tolak dengan 422":"Ikut SLA, satu angka"});
      n++; continue;
    }
    T.push({n,who:"agent",d:day,at:at1,text:pair[0]});
    T.push({n,who:"human",d:day,at:stamp(),by:n%3?"adryanev":"rangga",text:pair[1]});
    if(n%7===4){ T.push({n,who:"sys",d:day,at:stamp(),text:"Draf PRD direvisi",art:n});
      R.push({turn:n,at:SHORT[day]+" "+at1,by:"agent"}); }
    if(n%2===1) D.push({turn:n,q:pair[0].replace(/\?$/,"").slice(0,42),a:pair[1].replace(/\.$/,"")});
  }
  T.push({n:80,who:"agent",d:3,at:"09:40",kind:"ask",
    text:"Draf terasa lengkap buat saya. Bagaimana menurut kamu?",choices:CHOICES});
  R.push({turn:23,at:"Rab 10:20",by:"rangga",human:true});
  R.push({turn:52,at:"Kam 08:40",by:"dita",human:true});
  R.sort((a,b)=>a.turn-b.turn);
  return {T,D,R:R.slice(-9)};
}

  const q=st.find.trim().toLowerCase();
  T.forEach(t=>{
    if(q && !(t.text||"").toLowerCase().includes(q)) return;
    if(lastDay!==null && t.d!==lastDay && !q)
      out+=`<div class="daybreak">${DAYS[t.d]} — tab ditutup semalam, kembali pagi ini</div>`;
    if(!q && prevN && t.n>prevN+1) out+=foldHTML(prevN+1,t.n-1,t.d);
    prevN=Math.max(prevN,t.n);
    lastDay=t.d;
    if(t.who==="sys"){
      out+=`<div class="turn"><div class="bubble sys">${ic("doc",13)}
        <span>${esc(t.text)} — Artifact <span class="mono">prd</span> milik StepRun giliran ${t.art}</span>
        <button class="ghost sm" style="margin-left:auto" data-rev="${t.art}">Lihat${ic("chevR",11)}</button>
      </div></div>`;
      return;
    }
    const isEdit = t.kind==="edit";
    if(isEdit && V("edit")==="convo"){
      /* tanpa suntingan langsung, giliran ini jadi jawaban teks biasa */
      out+=`<div class="turn"><div class="thd"><span class="who human">${esc(t.by)}</span>
        <span class="mono">giliran ${t.n}</span><span class="dot"></span>
        <span>${SHORT[t.d]} ${t.at}</span>${turnControls(t)}</div>
        <div class="bubble human">Tolong tambahkan bagian Batasan: maksimum 100 item per cart.</div></div>`;
      return;
    }
    const isAsk = t.kind==="ask";
    const who = t.who==="agent"?"Agent":esc(t.by);
    let tag="";
    if(isEdit) tag=`<span class="chip att">${ic("pencil",11)}edit-artifact</span>`;
    else if(isAsk) tag=`<span class="chip inf">kind ${V("end")==="approval"?"approval"
      :V("ans")==="text"?"text":V("ans")==="choice"?"choice":"choice + text"}</span>`;
    out+=`<div class="turn" id="t${t.n}">
      <div class="thd"><span class="who ${t.who}">${who}</span>
        <span class="mono">giliran ${t.n}${isAsk?" · attempt 1":""}</span><span class="dot"></span>
        <span>${SHORT[t.d]} ${t.at}</span>${tag}${turnControls(t)}</div>
      <div class="bubble ${t.who}${isEdit?" byhand":""}${isAsk&&!st.answered?" live":""}">${esc(t.text)}
        ${isAsk&&!st.answered?askBlock(t):""}
        ${isAsk&&st.answered?`<div class="fg3" style="margin-top:.5rem;font-size:var(--fs-xs)">
          Dijawab <b class="fg2">adryanev</b> — jawaban pertama menang, penjawab dicatat.</div>`:""}
      </div></div>`;
  });
  if(q && !out) out=`<div class="band" style="margin:.5rem">${ic("search",13)}
    Tidak ada giliran yang memuat “${esc(st.find)}”.</div>`;
  if(st.busy) out+=busyBlock();
  return out;
}
function composer(){
  if(st.busy) return `<div class="composer"><div class="locked">${ic("clock",13)}
    Menunggu agent menyelesaikan giliran ${LAST()+1}. Kotak jawaban tertutup sampai Question berikutnya terbit.</div></div>`;
  if(st.answered) return `<div class="composer"><div class="locked">${ic("check",13)}
    Jawaban terkirim. StepRun kembali <span class="mono">ready</span>; tidak ada Question terbuka.</div></div>`;

  const showText = V("ans")!=="choice";

      <li>Sakelar dimuat pada kombinasi yang dipilih saat ticket 17 diresolusi:
        <b>berdampingan · pilihan + teks · sunting langsung · ringkasan · tab keputusan ·
        jawaban terakhir · rewind</b>. Sisanya tetap bisa dinyalakan untuk melihat apa yang ditolak.</li>
    </ul>
    <h3>Yang diuji layar ini</h3><ul>
      <li><b>Tata letak</b> — <i>Berdampingan</i> membuat draf tumbuh di depan mata.
        <i>Draf dominan</i> menyempitkan percakapan jadi kolom kurus. <i>Bertumpuk</i> menjaga keduanya
        terlihat tapi memotong tinggi masing-masing. <i>Bergantian</i> menyembunyikan salah satunya —
        perhatikan apakah fiturnya masih punya maksud di situ.</li>
      <li><b>Bentuk giliran</b> — <i>Pilihan saja</i> mematikan kotak teks; bandingkan dengan
        <span class="mono">/grilling</span> di terminal yang tidak pernah membatasi jawaban.
        <i>Teks saja</i> membuang percepatan pada pertanyaan berjawaban terbatas.</li>
      <li><b>Suntingan manusia</b> — ketiganya beda ongkos. <i>Sunting langsung</i> = Artifact baru milik
        StepRun giliran berikutnya. <i>Usul</i> = satu putaran Runner penuh sebelum kamu melihat hasilnya.
        <i>Lewat percakapan</i> = tiap perubahan punya giliran yang menjelaskannya.</li>
      <li><b>Kembali besok</b> — <i>Tanpa penanda</i> dipasang supaya bisa ditolak sambil melihat:
        matikan penandanya, lalu cari sendiri apa yang berubah sejak kemarin.</li>
      <li><b>Menemukan lagi</b> — nyalakan <b>80 giliran</b> dulu, baru bandingkan ketiganya.
        Pada 15 giliran semuanya terasa cukup; itu sebabnya sakelar beban ada.</li>
      <li><b>Selesai</b> — <i>Jawaban terakhir</i> tidak punya tombol tersendiri; <i>Tombol Selesaikan</i>
        menambah jalan keluar kedua yang bisa ditekan kapan saja — dan menaruhnya bersebelahan dengan
        <b>Batalkan Run</b> di bilah atas, persis susunan yang prototype 13 tolak; <i>approval</i> membuat
        penutupan jadi Question berjenis sendiri dengan <span class="mono">onReject</span> yang terbaca.</li>
      <li><b>Salah arah</b> — <i>Rewind</i> memunculkan kontrol per giliran (arahkan kursor ke sebuah giliran).
        Bentuknya sudah dikunci ticket 06: Run baru dengan <span class="mono">parent_run_id</span>,
        bukan penghapusan.</li>
    </ul>
    <h3>Yang bisa dicoba, bukan cuma dibaca</h3><ul>
      <li>Tekan <b>Kirim jawaban</b>. Yang muncul adalah <b>biaya setup per giliran</b> — lima langkah yang
        ticket 17 minta diukur. Angkanya palsu; bentuknya tidak.</li>
      <li>Klik chip riwayat <b>giliran 11</b> di atas draf. Itu Artifact milik StepRun lain, bukan versi
        lama dari dokumen yang sama — immutable, satu per StepRun.</li>
      <li>Tombol <b>1</b>, <b>2</b>, <b>3</b> memilih jawaban; <b>Esc</b> menutup panel konfirmasi.</li>
    </ul>
    <h3>Yang prototype ini tidak bisa jawab</h3><ul>
      <li><b>Angka biaya setup</b> — start container, fetch branch, unduh session, cold start agent.
        Data palsu tidak menghasilkan angka. Sampai ada pengukuran di Runner sungguhan,
        <i>ambang tahan-sandbox</i> tetap kabut dan 30–60 detik tetap tebakan.</li>
    </ul>
  </div>`;
}

/* ================================================================= render */
const scrolls={};
function render(){
  document.querySelectorAll("[data-scroll]").forEach(el=>scrolls[el.dataset.scroll]=el.scrollTop);
  document.documentElement.dataset.theme=st.theme;
  $("#app").innerHTML = st.screen==="session"?sessionScreen():inboxScreen();
  document.querySelectorAll("[data-scroll]").forEach(el=>{
    if(scrolls[el.dataset.scroll]!=null) el.scrollTop=scrolls[el.dataset.scroll];
  });
}
function jump(turn){
  if(V("lay")==="tab") st.tab="conv";
  render();
  const el=document.getElementById("t"+turn);
  if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
}
function startBusy(){
  st.busy={i:0,ms:0}; st.answered=true; st.editing=false; render();
  const t0=Date.now();
  clearInterval(startBusy.tick); clearInterval(startBusy.step);
  startBusy.tick=setInterval(()=>{ if(!st.busy) return clearInterval(startBusy.tick);
    st.busy.ms=(Date.now()-t0)*5; const el=document.querySelector(".busy .el");
    if(el) el.textContent=(st.busy.ms/1000).toFixed(1)+"s"; },100);
  let i=0;
  const next=()=>{
    if(i>=SETUP.length){ clearInterval(startBusy.tick); st.busy=null; st.answered=true; return render(); }
    st.busy.i=i; render(); const wait=SETUP[i].ms/5; i++; setTimeout(next,wait);
  };
  next();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-v],[data-fold],[data-right],[data-rev],[data-act],[data-goto],[data-tab]");
  if(!t) return;
  if(t.dataset.fold){ const k=t.dataset.fold;
    st.open.has(k)?st.open.delete(k):st.open.add(k); return render(); }
  if(t.dataset.v){ st.v[t.dataset.v]=t.dataset.val;
    if(t.dataset.v==="len"){ st.rev=t.dataset.val==="80"?revsTopAfter():13; st.find=""; }
    if(t.dataset.v==="rec"&&t.dataset.val!=="tab") st.right="draft";
    if(t.dataset.v==="lay"&&t.dataset.val==="tab") st.tab="conv";
    return render(); }
  if(t.dataset.tab){ st.tab=t.dataset.tab; return render(); }
  if(t.dataset.right){ st.right=t.dataset.right; return render(); }
  if(t.dataset.rev){ st.rev=+t.dataset.rev; st.right="draft";
    if(V("lay")==="tab") st.tab="draft"; return render(); }
  if(t.dataset.goto){ return jump(+t.dataset.goto); }
  const a=t.dataset.act, turn=+t.dataset.turn;
  switch(a){
    case "theme": st.theme=st.theme==="dark"?"light":"dark"; return render();
    case "inbox": st.screen="inbox"; return render();
    case "session": st.screen="session"; return render();
    case "railtoggle": st.dopen=!st.dopen; return render();
    case "jump": return jump(LAST());
    case "editdraft": st.editing=true; st.right="draft";
      if(V("lay")==="tab") st.tab="draft"; return render();
    case "canceledit": st.editing=false; return render();
    case "saveedit": st.editing=false; return startBusy();
    case "choose": case "send": case "finish": return startBusy();
    case "reject": st.confirm=null; return startBusy();
    case "cancel": st.confirm={kind:"cancel"}; return render();
    case "rewind": st.confirm={kind:"rewind",turn}; return render();
    case "discard": st.confirm={kind:"discard",turn}; return render();
    case "closeconfirm": st.confirm=null; return render();
    case "docancel": case "dorewind": st.confirm=null; st.answered=true; return render();
  }
});
function revsTopAfter(){ const R=revs(); return R[R.length-1].turn; }
document.addEventListener("input",e=>{ if(e.target.id==="find"){ st.find=e.target.value;
  const p=e.target.selectionStart; render();
  const f=document.getElementById("find"); if(f){ f.focus(); f.setSelectionRange(p,p);} }});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&st.confirm){ st.confirm=null; return render(); }
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
  if(["1","2","3"].includes(e.key)&&!st.answered&&V("ans")!=="text"&&V("end")!=="approval"){
    const c=document.querySelectorAll(".choice")[+e.key-1]; if(c) c.click();
  }
});
render();
</script>
