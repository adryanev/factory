# Base Garage config for the single-node self-host deployment.
#
# Deliberately minimal: replication_factor = 1 and db_engine = "sqlite" are decisions
# (single machine, no cluster story), not defaults left in place. rpc_secret and the
# default bucket/access-key are NOT set here -- they come from GARAGE_RPC_SECRET,
# GARAGE_DEFAULT_ACCESS_KEY, GARAGE_DEFAULT_SECRET_KEY env vars (compose.yaml), per the
# spec's "service passwords -> environment variable" split. Garage reads env over file
# for these, verified hands-on.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
