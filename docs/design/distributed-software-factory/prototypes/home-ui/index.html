<!--
  Beranda Factory — hasil dua belas ronde grilling desain.

  Prototipe buangan. Ia menjawab satu pertanyaan: bentuk apa yang dipakai
  surface beranda, yang hari ini masih berupa fallback tanpa gaya di
  packages/web/src/App.tsx (header + QuestionList).

  Keputusan yang sudah dijatuhkan, dari akar ke daun. Tiap ronde memakai
  lima prototipe berdampingan; yang tertulis di bawah adalah yang menang,
  dan yang kalah sudah dibuang dari file ini.

    1. Bentuk beranda ....... Kendali — nav rail kiri, pusat kerja, rail
                              kanan (Run, runner pool, biaya). Bukan inbox
                              satu kolom, bukan tabel Run, bukan linimasa,
                              bukan kartu proyek.
    2. Komposisi pusat ...... Fokus tunggal — pusat ikut keadaan. Ada
                              Question menunggu, pusat adalah pertanyaannya.
                              Tidak ada, pusat kembali jadi Graph.
                              Syarat tambahan: Graph tidak boleh hilang.
    3. Cara keduanya duduk .. Lengket — Graph tetap jadi permukaan kerja,
                              pertanyaan jadi sheet yang bersandar ke node
                              awaiting-human lewat tali putus-putus, di dalam
                              ruang koordinat Graph.
    4. Perilaku sheet ....... Mengikuti — sheet tetap di dalam pandangan saat
                              kanvas digeser; talinya digambar ulang tiap
                              scroll sehingga ikatan ke node tidak putus.
    5. Kendali jawaban ...... Konsekuensi — tiap pilihan menyebut akibatnya
                              di Graph ("Setujui -> pecah-tugas jalan,
                              fan-out implementasi lahir 3 cabang"), karena
                              salah jawab di sini melahirkan fan-out, membuka
                              PR, atau membatalkan Run.
    6. Sunting Artifact ..... Diff lalu sunting — baca perubahan giliran ini
                              dulu (baris agent, baris manusia, baris
                              dibuang), baru menyunting.
    7. Skala tipe ........... Regang atas — usulan perubahan untuk
                              packages/web/src/tokens/tokens.css, BELUM
                              diterapkan di sana. xs (0.75) dan sm (0.875)
                              dibekukan pada nilai Corpus sehingga 68
                              pemakaian di UI padat tidak berubah rupa;
                              base ke atas direnggangkan:
                                base 1 · lg 1.25 · xl 1.5 · 2xl 1.875
                              dan dua ujung yang selama enam ronde bocor
                              sebagai literal diresmikan:
                                2xs 0.6875 · 3xl 2.25
                              Alasannya bukan rasio. Dari 75 pemakaian nyata
                              di packages/web/src, 68 menumpuk di xs (52) dan
                              sm (16); empat langkah teratas dipakai tujuh
                              kali di seluruh produk. Hierarki tinggal di
                              langkah atas, jadi di sanalah rasio diperbaiki.
                              Ditolak: skala 1.25 penuh (membesarkan seluruh
                              UI padat demi kerapian angka, 68 call site),
                              dan tangga berat-tanpa-ukuran (layak sebagai
                              pendamping, bukan pengganti).
    8. Isi rail kanan ....... Warisan — Run, runner pool, biaya. Rail memang
                              untuk mengawasi pabrik, bukan inspektur kanvas,
                              bukan antrean berikutnya. Ditolak dua kali:
                              "kosong saat sehat" (rail hanya muncul saat ada
                              yang salah) dan "tanpa rail". Artinya pemantauan
                              ambient berhak atas sepertiga layar walau 95%
                              waktunya tidak menuntut tindakan.
    9. Komposisi rail ....... Alarm di kepala — pita alarm di atas rail,
                              ketiga panel tetap utuh di bawahnya. Alarm
                              menambah, tidak pernah menggantikan. Ditolak:
                              urutan panel yang bergeser mengikuti keadaan
                              (membunuh memori otot), pembubaran batas panel
                              jadi satu daftar berperingkat, dan kepadatan
                              tabel penuh.
   10. Perilaku pita ....... Satu baris — tiap alarm satu baris padat, semua
                              alarm tetap terlihat setiap saat, detail
                              dibuang. Ditolak semua yang menyembunyikan atau
                              memotong: kartu tanpa batas, "satu yang
                              terburuk + n lagi", pita bertinggi patok yang
                              menggulir sendiri, dan keping berangka yang
                              membuang isi sama sekali.
   11. Isi satu baris ...... Buka di tempat — baris tetap ringkas, tapi bisa
                              ditekan dan keterangan penuhnya terbuka di
                              bawahnya tanpa keluar dari rail. Ditolak: fakta
                              yang memutuskan dipadatkan ke slot kanan (satu
                              fakta tidak selalu cukup, dan rail cuma 19rem),
                              kata kerja menggantikan fakta, dan dua baris
                              yang tidak membuang apa pun.
   12. Satu alarm itu apa .. Per jenis, isi utuh — kepalanya mengelompok
                              ("4 Run gagal"), isinya tidak: dibuka jadi
                              empat baris bernama lengkap dengan attempt-nya.
                              Pengelompokan jadi kompresi, bukan pembuangan;
                              jumlah baris pita stabil terhadap beban (6 di
                              Banjir, 5 di Gawat, 1 di Sibuk). Ditolak: per
                              jenis yang membuang identitas kejadian, per
                              kejadian tanpa kelompok (17 baris di Banjir),
                              per proyek, dan per sebab.

  Aturan yang dipegang sepanjang dua belas ronde, semuanya dari kode yang
  ada, bukan karangan prototipe ini:

    - Token Corpus disalin verbatim dari packages/web/src/tokens/tokens.css.
      Pasangan tema dikunci: terang dan gelap, tidak ada palet ketiga.
    - Status adalah bentuk dulu, warna kedua — glyph-nya cermin persis
      packages/web/src/primitives/StatusMark.tsx.
    - Notasi giliran ditulis panjang ("giliran 4 - attempt 1") di mana pun
      kecuali nama Branch — packages/web/src/primitives/turnNotation.ts.
    - --attention (ungu) hanya menandai yang ditulis manusia langsung ke
      dalam Artifact. Tidak pernah untuk peringatan, keadaan menunggu, atau
      penekanan apa pun. Lihat komentar di tokens.css dan tokens/colors.ts.
    - Rethink Sans di-inline sebagai data URI karena ia face --display yang
      disebut tokens.css, dan fallback diam ke system stack akan menyesatkan
      penilaian.

  Tidak ada ronde yang sedang berjalan. Pemilih desain tinggal satu tombol;
  tidak ada varian yang tersisa di file ini.

  Yang BELUM diputuskan dan masih layak digrill: baris meta di kepala sheet
  (enam fakta dalam satu baris datar), keadaan pertama kali pakai, dan
  perilaku saat satu orang memegang banyak Project.

  Data di bawah tiruan, tapi bentuknya mengikuti wire yang asli:
  QuestionState, RunRecord, StepRunRecord, RunnerPoolRecord, RunCostRecord.

  Empat keadaan: Sibuk (1 alarm), Tenang (0), Gawat (5), Banjir (8 — satu
  region mati dan seluruh akibatnya jatuh bersamaan). Banjir ditambahkan di
  ronde 11 untuk menguji pita alarm di bawah beban; jangan menilai pusat di
  sana, ia memakai graph yang sama dengan Gawat.
-->

   ========================================================================== */

/* ==========================================================================
   Token Corpus — verbatim dari packages/web/src/tokens/tokens.css.
   Pasangan tema dikunci: terang dan gelap, tidak ada palet ketiga.
   ========================================================================== */
:root {
  --blue-3: #54aeff; --blue-5: #0969da;
  --green-3: #4ac26b; --green-5: #1a7f37;
  --yellow-3: #fec511; --yellow-5: #cd8401;
  --purple-4: #a475f9; --purple-5: #8250df;

  --radius: 0.875rem;
  --radius-sm: calc(var(--radius) * 0.6);
  --radius-md: calc(var(--radius) * 0.8);
  --radius-lg: var(--radius);

  /* Skala tipe — ronde 7, varian "Regang atas". xs dan sm dibekukan pada
     nilai Corpus, jadi 68 pemakaian di UI padat tidak berubah rupa; base ke
     atas direnggangkan ke rasio >=1.2, tempat hierarki sebenarnya tinggal.
     2xs dan 3xl adalah dua ujung yang selama enam ronde bocor sebagai
     literal — sekarang jadi token. */
  --fs-2xs: 0.6875rem; --fs-xs: 0.75rem; --fs-sm: 0.875rem; --fs-base: 1rem;
  --fs-lg: 1.25rem; --fs-xl: 1.5rem; --fs-2xl: 1.875rem; --fs-3xl: 2.25rem;
  --tracking-tight: -0.025em; --tracking-tighter: -0.05em;

  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --display: "Rethink Sans", var(--sans);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.16, 0.84, 0.44, 1);
  --dur: 0.18s;

  color-scheme: light;
  --bg: #f8fafc; --paper: #ffffff; --panel: #ffffff; --sunk: #f1f5f9;
  --fg: #020618; --fg-2: #45525f; --fg-3: #64748b;
  --border: #e2e8f0; --border-2: #cbd5e1;
  --primary: #009689; --primary-fg: #f8fafc; --ring: #009689;
  --info: var(--blue-5); --info-wash: #eef6ff; --info-line: #b6e3ff;
  --attention: var(--purple-5); --attention-wash: #faf2ff; --attention-line: #d8b9ff;
  --success: var(--green-5); --warning: var(--yellow-5);
  --destructive: #e7000b; --destructive-wash: #fff5f4; --destructive-line: #ffcecb;
  --shadow-xs: 0 1px 2px 0 rgb(2 6 24 / 0.05);
  --shadow-sm: 0 1px 3px 0 rgb(2 6 24 / 0.09), 0 1px 2px -1px rgb(2 6 24 / 0.07);
  --shadow-md: 0 4px 6px -1px rgb(2 6 24 / 0.08), 0 2px 4px -2px rgb(2 6 24 / 0.06);
  --shadow-lg: 0 10px 15px -3px rgb(2 6 24 / 0.1), 0 4px 6px -4px rgb(2 6 24 / 0.08);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1f2328; --paper: #25292e; --panel: #25292e; --sunk: #1a1d21;
    --fg: #f6f8fa; --fg-2: #c8d1da; --fg-3: #97a1ad;
    --border: #454c54; --border-2: #5a626b;
    --primary: #2fe0e1; --primary-fg: #003d46; --ring: #2fe0e1;
    --info: var(--blue-3); --info-wash: #16263a; --info-line: #284b73;
    --attention: var(--purple-4); --attention-wash: #241c37; --attention-line: #4a3a75;
    --success: var(--green-3); --warning: var(--yellow-3);
    --destructive: #fa4549; --destructive-wash: #341a1c; --destructive-line: #68282c;
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.3);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.4), 0 1px 2px -1px rgb(0 0 0 / 0.35);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.45), 0 2px 4px -2px rgb(0 0 0 / 0.35);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.55), 0 4px 6px -4px rgb(0 0 0 / 0.4);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1f2328; --paper: #25292e; --panel: #25292e; --sunk: #1a1d21;
  --fg: #f6f8fa; --fg-2: #c8d1da; --fg-3: #97a1ad;
  --border: #454c54; --border-2: #5a626b;
  --primary: #2fe0e1; --primary-fg: #003d46; --ring: #2fe0e1;
  --info: var(--blue-3); --info-wash: #16263a; --info-line: #284b73;
  --attention: var(--purple-4); --attention-wash: #241c37; --attention-line: #4a3a75;
  --success: var(--green-3); --warning: var(--yellow-3);
  --destructive: #fa4549; --destructive-wash: #341a1c; --destructive-line: #68282c;
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.3);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.4), 0 1px 2px -1px rgb(0 0 0 / 0.35);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.45), 0 2px 4px -2px rgb(0 0 0 / 0.35);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.55), 0 4px 6px -4px rgb(0 0 0 / 0.4);
}

/* Peran status — satu per status StepRun, diturunkan, bukan warna baru. */
:root {
  --status-ready: var(--fg-3);
  --status-running: var(--info);
  --status-awaiting-human: var(--warning);
  --status-succeeded: var(--success);
  --status-failed: var(--destructive);
  --status-skipped: var(--fg-3);
  --status-cancelled: var(--border-2);
  --status-unschedulable: var(--fg-2);
}

/* ==========================================================================
   Dasar
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: var(--fs-sm); line-height: 1.55;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  overflow: hidden;
}
h1, h2, h3 { font-family: var(--display); letter-spacing: var(--tracking-tight); margin: 0; text-wrap: balance; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: inherit; }
code { font-family: var(--mono); font-size: 0.92em; letter-spacing: -0.01em; }
:where(button, a, input, textarea, [tabindex]):focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
.fg2 { color: var(--fg-2); } .fg3 { color: var(--fg-3); }
.tnum { font-variant-numeric: tabular-nums; }
.sp { flex: 1; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn {
  font: inherit; font-weight: 500; color: var(--fg); background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 0.35rem 0.7rem; cursor: pointer; display: inline-flex; align-items: center;
  gap: 0.4rem; white-space: nowrap;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn:hover { border-color: var(--border-2); background: var(--sunk); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg > button {
  font: inherit; font-size: var(--fs-xs); font-weight: 500; border: 0; background: transparent;
  color: var(--fg-3); padding: 0.25rem 0.6rem; border-radius: calc(var(--radius-sm) - 2px);
  cursor: pointer; white-space: nowrap;
}
.seg > button:hover { color: var(--fg); }
.seg > button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--shadow-xs); }

.chip {
  display: inline-flex; align-items: center; gap: 0.3rem; border: 1px solid var(--border);
  border-radius: 999px; padding: 0.1rem 0.5rem; font-size: var(--fs-xs); font-weight: 500;
  color: var(--fg-3); background: var(--panel); white-space: nowrap;
}
.chip--wait { border-color: color-mix(in srgb, var(--warning) 40%, var(--border)); color: var(--warning); background: color-mix(in srgb, var(--warning) 9%, var(--panel)); }
.chip--run { border-color: var(--info-line); color: var(--info); background: var(--info-wash); }
.chip--fail { border-color: var(--destructive-line); color: var(--destructive); background: var(--destructive-wash); }
/* --attention dipersempit ke satu makna: manusia menulis ini ke dalam Artifact. */
.chip--byhand { border-color: var(--attention-line); color: var(--attention); background: var(--attention-wash); }

.kbd {
  min-width: 1.25rem; height: 1.25rem; padding: 0 0.3rem; border-radius: 5px;
  background: var(--sunk); border: 1px solid var(--border); display: inline-grid; place-items: center;
  font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 600; color: var(--fg-3);
}
.dotsep { width: 3px; height: 3px; border-radius: 50%; background: var(--border-2); flex: none; }

/* Tanda status — cermin packages/web/src/primitives/StatusMark.tsx.
   Status adalah bentuk dulu; warna sinyal kedua, tidak pernah satu-satunya. */
.mark { display: inline-flex; align-items: center; line-height: 0; flex: none; }
.mark svg { display: block; }
.spin { transform-origin: 8px 8px; animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.strip { display: inline-flex; align-items: center; gap: 2px; }
.strip__seg { width: 0.4rem; height: 1rem; border-radius: 2px; background: currentColor; }
.strip__seg[data-status="ready"], .strip__seg[data-status="skipped"] { opacity: 0.3; }
.strip__seg[data-status="cancelled"] { opacity: 0.45; }
.strip__seg[data-status="running"] { animation: pulse 1.8s var(--ease) infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@media (prefers-reduced-motion: reduce) { .strip__seg[data-status="running"] { animation: none; } }
.strip__gap { width: 0.4rem; }

/* ==========================================================================
   Shell Kendali — dipakai kelima varian, hanya gridnya yang berbeda
   ========================================================================== */
#app { height: 100vh; }
.k { display: grid; height: 100vh; min-height: 0; }
.k > * { min-width: 0; min-height: 0; }

/* v1 rail kanan · v2 inbox kiri · v3 pita atas · v4 fokus · v5 konsol */
.k[data-v="1"] { grid-template-columns: 13rem minmax(0, 1fr) 21rem; }
.k[data-v="2"] { grid-template-columns: 13rem 27rem minmax(0, 1fr); }
.k[data-v="3"] { grid-template-columns: 13rem minmax(0, 1fr); }
.k[data-v="4"] { grid-template-columns: 13rem minmax(0, 1fr) 19rem; }
.k[data-v="5"] { grid-template-columns: 13rem 23rem minmax(0, 1fr) 17rem; }

@media (max-width: 1400px) { .k[data-v="5"] { grid-template-columns: 13rem 21rem minmax(0, 1fr); } .k[data-v="5"] .k__rail { display: none; } }
@media (max-width: 1180px) {
  .k[data-v="1"], .k[data-v="4"] { grid-template-columns: 13rem minmax(0, 1fr); }
  .k[data-v="1"] .k__rail, .k[data-v="4"] .k__rail { display: none; }
  .k[data-v="2"] { grid-template-columns: 13rem 24rem minmax(0, 1fr); }
  .k[data-v="5"] { grid-template-columns: 13rem minmax(0, 1fr); }
  .k[data-v="5"] .k__inbox { display: none; }
}

/* ---- nav rail ---- */
.k__nav { background: var(--panel); border-right: 1px solid var(--border); padding: 0.875rem 0.625rem; display: flex; flex-direction: column; gap: 0.125rem; overflow: auto; }
.k__brand { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.5rem 1.25rem; font-family: var(--display); font-weight: 700; letter-spacing: var(--tracking-tight); }

/* ---- kolom generik ---- */
.k__col { display: flex; flex-direction: column; overflow: hidden; background: var(--panel); }

}

/* ---- panel di rail ---- */

/* ---- kartu Question ---- */
.q {
  display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;

}

}

.node {

.pk__d {
  display: flex; align-items: center; gap: 0.5rem; width: 100%; text-align: left; font: inherit;
  cursor: pointer; color: var(--fg-2); background: transparent; border: 1px solid transparent;
  border-radius: var(--radius-sm); padding: 0.3rem 0.45rem;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.pk__d:hover { background: var(--sunk); color: var(--fg); }
.pk__d[aria-pressed="true"] { background: var(--sunk); border-color: var(--border); color: var(--fg); font-weight: 600; }
.pk__idx { width: 1.1rem; height: 1.1rem; border-radius: 4px; background: var(--sunk); border: 1px solid var(--border); display: grid; place-items: center; font-family: var(--mono); font-size: 0.625rem; font-weight: 700; color: var(--fg-3); flex: none; }
.pk__d[aria-pressed="true"] .pk__idx { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.pk__dnote { margin-left: auto; color: var(--fg-3); font-size: var(--fs-2xs); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk__row { display: flex; align-items: center; gap: 0.4rem; }
.pk__label { font-size: var(--fs-2xs); letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.pk__hint { display: flex; align-items: center; gap: 0.3rem; color: var(--fg-3); border-top: 1px solid var(--border); padding-top: 0.5rem; flex-wrap: wrap; }
.pk__seg { width: 100%; }
.pk__seg > button { flex: 1; justify-content: center; text-align: center; }

/* ==========================================================================
   RONDE 3 — pertanyaan dan graph berbagi pusat. Nav, rail, token, dan
   kendali jawaban dipegang tetap; hanya komposisi pusat yang berbeda.
   ========================================================================== */
.ctr { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

/* --- f1 tumpuk: satu kolom yang di-scroll, putusan dulu lalu sebabnya --- */
.ctr--stack { overflow: auto; }
.stack__q { padding: 2.25rem 2rem 1.75rem; background: var(--bg); }
.stack__wrap { max-width: 46rem; }
.stack__graph { border-top: 1px solid var(--border); display: flex; flex-direction: column; min-height: 26rem; }

/* --- f2 belah: pertanyaan kiri, graph kanan, dua-duanya penuh tinggi --- */
.ctr--split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
.ctr--split > * { min-width: 0; overflow: hidden; }
.split__q { overflow: auto; padding: 1.75rem 1.5rem 2.5rem; border-right: 1px solid var(--border); }
.split__g { display: flex; flex-direction: column; }
@media (max-width: 1240px) { .ctr--split { grid-template-columns: minmax(0, 1fr); } .ctr--split .split__g { display: none; } }

/* --- f3 lengket: graph adalah permukaan kerja, pertanyaan menempel ke node --- */
.sheet {
  position: absolute; width: 25rem; background: var(--panel);
  border: 1px solid color-mix(in srgb, var(--warning) 45%, var(--border));
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 1rem 1.125rem; z-index: 4;
}
.sheet__hd { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; font-size: var(--fs-2xs); color: var(--fg-3); }
.sheet__ask { margin-top: 0.6rem; font-family: var(--display); font-size: var(--fs-xl); line-height: 1.3; font-weight: 700; letter-spacing: var(--tracking-tight); }
.sheet__more { margin-top: 0.875rem; padding-top: 0.7rem; border-top: 1px solid var(--border); font-size: var(--fs-xs); color: var(--fg-3); display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

/* --- f4 peta: graph diringkas jadi pita orientasi, pertanyaan pegang sisanya --- */
.minimap { flex: none; background: var(--panel); border-bottom: 1px solid var(--border); padding: 0.6rem 1rem 0.7rem; }
.minimap__hd { display: flex; align-items: center; gap: 0.5rem; font-size: var(--fs-2xs); color: var(--fg-3); margin-bottom: 0.5rem; }
.minimap__hd b { color: var(--fg-2); font-weight: 600; }
.minimap__track { display: flex; align-items: center; gap: 0; overflow-x: auto; padding-bottom: 0.15rem; }
.mmcol { display: flex; flex-direction: column; gap: 0.25rem; flex: none; }
.mmchip {
  display: flex; align-items: center; gap: 0.35rem; background: var(--sunk);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 0.25rem 0.5rem; font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 600;
  white-space: nowrap; cursor: pointer;
  transition: border-color var(--dur) var(--ease);
}
.mmchip:hover { border-color: var(--border-2); }
.mmchip[data-here="true"] { border-color: color-mix(in srgb, var(--warning) 50%, var(--border)); background: color-mix(in srgb, var(--warning) 10%, var(--panel)); }
.mmchip__n { color: var(--fg-3); font-family: var(--sans); font-weight: 500; }
.mmlink { flex: none; width: 1.25rem; height: 1px; background: var(--border-2); }

/* --- f5 node mekar: tidak ada zona terpisah, node yang menunggu jadi kartu --- */
.node--bloom {
  width: 25rem; cursor: default; padding: 0.875rem 1rem; z-index: 5;
  border-color: color-mix(in srgb, var(--warning) 45%, var(--border));
  box-shadow: var(--shadow-lg), 0 0 0 3px color-mix(in srgb, var(--warning) 14%, transparent);
}
.node--bloom:hover { transform: none; border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); }
.node--bloom .node__key { font-size: var(--fs-sm); }
.bloom__ask { margin-top: 0.5rem; font-size: var(--fs-base); line-height: 1.45; font-weight: 500; }

/* ==========================================================================
   RONDE 4 — komponen sheet. Graph, nav, rail, dan kendali jawaban dipegang
   tetap; yang berbeda hanya bagaimana sheet bersandar ke node dan bagaimana
   ia membawa sisa antrean.
   ========================================================================== */

/* s2 menyatu — sheet dilas ke sisi kanan node, tanpa jarak dan tanpa konektor */
.weld { position: absolute; display: flex; align-items: flex-start; z-index: 4; }
.weld__node {
  flex: none; width: 10.5rem; align-self: stretch;
  background: color-mix(in srgb, var(--warning) 10%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--warning) 45%, var(--border));
  border-right: 0; border-radius: var(--radius-lg) 0 0 var(--radius-lg);
  padding: 0.75rem 0.75rem;
}
.weld__sheet {
  flex: none; width: 25rem; background: var(--panel);
  border: 1px solid color-mix(in srgb, var(--warning) 45%, var(--border));
  border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
  box-shadow: var(--shadow-lg); padding: 1rem 1.125rem;
}
.weld__seam { flex: none; width: 1px; background: color-mix(in srgb, var(--warning) 32%, var(--border)); align-self: stretch; }

/* s3 mengikuti — sheet tetap di dalam pandangan saat kanvas di-scroll */
.sheet--follow { transition: none; }
.sheet__pin { display: inline-flex; align-items: center; gap: 0.3rem; font-size: var(--fs-2xs); color: var(--fg-3); }

/* s4 tumpukan — antrean dibawa sheet: yang aktif di depan, sisanya mengintip */
.sheet--stack::before, .sheet--stack::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
}
.sheet--stack::before { transform: translate(0.45rem, 0.45rem) scale(0.985); }
.sheet--stack::after { transform: translate(0.9rem, 0.9rem) scale(0.97); opacity: 0.7; }
.sheet--stack[data-rest="0"]::before, .sheet--stack[data-rest="0"]::after { display: none; }
.sheet--stack[data-rest="1"]::after { display: none; }
.stackbar { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.6rem; font-size: var(--fs-2xs); color: var(--fg-3); }
.stackbar__dots { display: flex; gap: 3px; margin-left: auto; }
.stackbar__dot { width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--border-2); }
.stackbar__dot[data-on="true"] { background: var(--warning); }

/* s5 laci — sheet turun jadi laci selebar kanvas di bawah graph */
.ctr--drawer { display: flex; flex-direction: column; }
.ctr--drawer .k__canvas { flex: 1 1 0; min-height: 0; }
.drawer {
  flex: none; background: var(--panel);
  border-top: 1px solid color-mix(in srgb, var(--warning) 45%, var(--border));
  box-shadow: 0 -6px 16px -8px rgb(2 6 24 / 0.14);
  max-height: 22rem; overflow: auto;
}
:root[data-theme="dark"] .drawer, :root:not([data-theme="light"]) .drawer { box-shadow: 0 -6px 16px -8px rgb(0 0 0 / 0.5); }
.drawer__riser { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1.25rem 0; font-size: var(--fs-2xs); color: var(--fg-3); }
.drawer__riser .dash { flex: none; width: 1.75rem; border-top: 1px dashed color-mix(in srgb, var(--warning) 55%, var(--border)); }
.drawer__body { padding: 0.5rem 1.25rem 1.25rem; max-width: 52rem; }
.drawer__ask { margin-top: 0.5rem; font-family: var(--display); font-size: var(--fs-xl); line-height: 1.32; font-weight: 700; letter-spacing: var(--tracking-tight); }

/* ==========================================================================
   RONDE 5 — kendali jawaban. Shell, graph, dan sheet "Mengikuti" dipegang
   tetap. Yang berbeda: bagaimana keempat kind Question diminta dijawab.
   ========================================================================== */

/* bingkai seragam (c2) */
.ans { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-top: 0.75rem; }
.ans__hd { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.65rem; background: var(--sunk); border-bottom: 1px solid var(--border); font-size: var(--fs-2xs); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--fg-3); }
.ans__body { padding: 0.65rem; display: flex; flex-direction: column; gap: 0.3rem; }
.ans__ft { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.65rem; border-top: 1px solid var(--border); background: var(--sunk); }
.ans .q__field { margin-top: 0; background: var(--panel); }

/* akibat (c3) */
.eff { display: block; margin-top: 0.15rem; font-size: var(--fs-2xs); color: var(--fg-3); line-height: 1.45; }
.eff code { color: var(--fg-2); }
.eff__arrow { color: var(--primary); font-weight: 700; }
.q__ctl--eff { flex-direction: column; align-items: stretch; gap: 0.4rem; }
.effbtn {
  display: flex; align-items: flex-start; gap: 0.5rem; width: 100%; text-align: left; font: inherit;
  cursor: pointer; background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0.5rem 0.6rem; color: var(--fg);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.effbtn:hover { border-color: var(--primary); background: var(--sunk); }
.effbtn--yes:hover { border-color: var(--primary); }
.effbtn--no:hover { border-color: var(--destructive-line); background: var(--destructive-wash); }
.effbtn b { font-weight: 600; }

/* papan tik (c4) */
.keyrow { display: flex; align-items: flex-start; gap: 0.5rem; }
.keyhint {
  display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.6rem;
  padding-top: 0.5rem; border-top: 1px dashed var(--border-2); font-size: var(--fs-2xs); color: var(--fg-3);
}
.keyopt {
  display: flex; align-items: center; gap: 0.55rem; width: 100%; text-align: left; font: inherit;
  cursor: pointer; background: var(--sunk); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0.35rem 0.5rem; color: var(--fg); font-size: var(--fs-xs);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.keyopt:hover { border-color: var(--primary); background: var(--panel); }

/* terbuka penuh (c5) */
.optcard {
  display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 0.7rem 0.8rem; color: var(--fg);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.optcard:hover { border-color: var(--primary); box-shadow: var(--shadow-xs); }
.optcard__t { font-weight: 600; display: flex; align-items: center; gap: 0.4rem; }
.optcard__d { color: var(--fg-2); font-size: var(--fs-xs); margin-top: 0.2rem; line-height: 1.5; }
.diff { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-top: 0.6rem; font-family: var(--mono); font-size: var(--fs-2xs); line-height: 1.6; }
.diff__hd { display: flex; padding: 0.3rem 0.6rem; background: var(--sunk); border-bottom: 1px solid var(--border); font-family: var(--sans); font-size: var(--fs-2xs); font-weight: 600; color: var(--fg-3); }
.diff__l { white-space: pre-wrap; padding: 0.05rem 0.6rem; }
.diff__l[data-k="add"] { background: color-mix(in srgb, var(--success) 12%, transparent); }
.diff__l[data-k="del"] { background: var(--destructive-wash); color: var(--fg-2); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--destructive) 55%, transparent); }
/* --attention hanya untuk yang ditulis manusia langsung ke Artifact */
.diff__l[data-k="hand"] { background: var(--attention-wash); box-shadow: inset 2px 0 0 var(--attention); }
.quoted { margin-top: 0.6rem; border-left: 2px solid var(--border-2); padding: 0.15rem 0 0.15rem 0.7rem; color: var(--fg-3); font-size: var(--fs-xs); line-height: 1.55; }

/* ==========================================================================
   RONDE 6 — kendali `edit-artifact`. Kind lain tetap memakai Konsekuensi.
   --attention dipakai di sini persis sesuai aturannya: menandai baris yang
   ditulis manusia langsung ke dalam Artifact, bukan "perlu perhatian".
   ========================================================================== */
.doc { font-family: var(--mono); font-size: var(--fs-2xs); line-height: 1.65; }
.doc__l { display: flex; gap: 0.5rem; padding: 0 0.6rem; }
.doc__t { white-space: pre-wrap; flex: 1; min-width: 0; }
.doc__gut { flex: none; width: 2px; border-radius: 1px; background: transparent; }
.doc__l[data-k="add"] .doc__gut { background: var(--info); }
.doc__l[data-k="hand"] .doc__gut { background: var(--attention); }
.doc__l[data-k="add"] { background: var(--info-wash); }
.doc__l[data-k="hand"] { background: var(--attention-wash); }
.doc__l[data-k="del"] { background: var(--destructive-wash); color: var(--fg-2); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--destructive) 55%, transparent); }
.docbox { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-top: 0.6rem; }
.docbox__hd { display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.6rem; background: var(--sunk); border-bottom: 1px solid var(--border); font-size: var(--fs-2xs); font-weight: 600; color: var(--fg-3); }
.docbox__hd code { font-weight: 700; color: var(--fg-2); }
.doclegend { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.4rem; font-size: var(--fs-2xs); color: var(--fg-3); }
.doclegend i { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 2px; margin-right: 0.3rem; vertical-align: -1px; }

/* a3 berdampingan */
.sbs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 0.6rem; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.sbs__pane { min-width: 0; display: flex; flex-direction: column; }
.sbs__pane + .sbs__pane { border-left: 1px solid var(--border); }
.sbs__hd { padding: 0.3rem 0.6rem; background: var(--sunk); border-bottom: 1px solid var(--border); font-size: var(--fs-2xs); font-weight: 600; color: var(--fg-3); display: flex; align-items: center; gap: 0.35rem; }
.sbs__body { padding: 0.35rem 0; overflow-x: auto; }
.sbs__edit { border: 0; border-radius: 0; margin: 0; min-height: 13rem; background: var(--panel); }

/* a4 sunting di tempat */
.inplace { border: 1px solid var(--border-2); border-radius: var(--radius-md); overflow: hidden; margin-top: 0.6rem; background: var(--panel); }
.inplace__body { padding: 0.4rem 0; }
.inplace__l { position: relative; }
.inplace__l[contenteditable]:focus { outline: 2px solid var(--ring); outline-offset: -2px; }
.inplace__ft { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.6rem; border-top: 1px solid var(--border); background: var(--sunk); font-size: var(--fs-2xs); color: var(--fg-3); flex-wrap: wrap; }

/* a5 komentar */
.cmt { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
.cmt__pin { flex: none; width: 1.35rem; height: 1.35rem; border-radius: 50%; background: var(--attention-wash); border: 1px solid var(--attention-line); color: var(--attention); display: grid; place-items: center; font-size: 0.625rem; font-weight: 700; }
.cmt__b { flex: 1; min-width: 0; background: var(--sunk); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.4rem 0.55rem; font-size: var(--fs-xs); line-height: 1.5; }
.cmt__q { font-family: var(--mono); font-size: var(--fs-2xs); color: var(--fg-3); border-left: 2px solid var(--border-2); padding-left: 0.45rem; margin-bottom: 0.25rem; display: block; }
.doc__l[data-pin] { cursor: pointer; }
.doc__l[data-pin]:hover { background: var(--sunk); }
.doc__pin { flex: none; width: 1.05rem; height: 1.05rem; border-radius: 50%; background: var(--attention-wash); border: 1px solid var(--attention-line); color: var(--attention); display: grid; place-items: center; font-size: 0.5625rem; font-weight: 700; font-family: var(--sans); }



/* ==========================================================================
   RONDE 8 — rail kanan. Isinya diputuskan: Run · runner · biaya. Yang kalah
   (inspektur, antrean, kosong-saat-sehat, tanpa rail) sudah dibuang.
   ========================================================================== */
.railq { display: flex; align-items: baseline; gap: 0.4rem; padding: 0.3rem 0; font-size: var(--fs-xs); }
.railq + .railq { border-top: 1px solid var(--border); }
.railq__k { font-family: var(--mono); font-size: var(--fs-2xs); color: var(--fg-2); }
.railq__v { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--fg-3); white-space: nowrap; }
.railq__v b { color: var(--fg); font-weight: 600; }

.steprow { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; font-size: var(--fs-xs); }
.steprow + .steprow { border-top: 1px solid var(--border); }
.steprow__k { font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steprow__m { margin-left: auto; color: var(--fg-3); font-size: var(--fs-2xs); white-space: nowrap; }

.alarm {
  display: flex; gap: 0.55rem; align-items: flex-start; padding: 0.6rem 0.7rem;
  border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--sunk);
  font-size: var(--fs-xs); line-height: 1.5;
}
.alarm + .alarm { margin-top: 0.5rem; }
.alarm[data-sev="fail"] { border-color: var(--destructive-line); background: var(--destructive-wash); }
.alarm[data-sev="warn"] { border-color: color-mix(in srgb, var(--warning) 40%, var(--border)); background: color-mix(in srgb, var(--warning) 8%, var(--panel)); }
.alarm__t { flex: 1; min-width: 0; }
.alarm__t b { font-weight: 600; }
.alarm__s { color: var(--fg-2); font-size: var(--fs-2xs); margin-top: 0.15rem; }
.allclear { text-align: center; padding: 1.5rem 0.5rem; color: var(--fg-3); font-size: var(--fs-xs); }
.allclear__m { color: var(--success); margin-bottom: 0.4rem; display: flex; justify-content: center; }
.allclear b { display: block; color: var(--fg); font-family: var(--display); font-size: var(--fs-base); font-weight: 700; margin-bottom: 0.15rem; }


/* ==========================================================================
   RONDE 10 — pita alarm. Ronde 9 memutuskan alarm menambah, tidak pernah
   PITA ALARM — hasil ronde 9 sampai 12. Ia menempel di kepala rail dan
   menambah, tidak pernah menggantikan; ketiga panel tetap utuh di bawahnya.
   Barisnya ringkas dan bisa dibuka di tempat. Alarm dikelompokkan per jenis,
   tapi isinya kejadian bernama lengkap.
   ========================================================================== */
.railtop { padding: 0.7rem 0 0.75rem; border-bottom: 1px solid var(--border); background: var(--sunk); }
.railtop__hd {
  display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.55rem; padding: 0 0.7rem;
  font-size: var(--fs-2xs); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--destructive);
}

.aline {
  display: flex; align-items: center; gap: 0.5rem; width: 100%; text-align: left; font: inherit;
  padding: 0.4rem 0.7rem; font-size: var(--fs-xs); background: none; border: 0; cursor: pointer;
  border-left: 2px solid transparent; color: var(--fg);
  transition: background var(--dur) var(--ease);
}
.aline:hover { background: var(--panel); }
.aline svg { flex: none; }
.aline__t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aline__f { margin-left: auto; flex: none; color: var(--fg-3); font-size: var(--fs-2xs); white-space: nowrap; }

.aitem + .aitem { border-top: 1px solid var(--border); }
.aitem[data-sev="fail"] .aline { border-left-color: var(--destructive); }
.aitem[data-sev="warn"] .aline { border-left-color: var(--warning); }

/* --- buka di tempat, pemenang ronde 11 --- */
.aexp {
  display: none; padding: 0 0.7rem 0.6rem 1.7rem;
  font-size: var(--fs-2xs); color: var(--fg-2); line-height: 1.55;
}
.aitem[data-open] .aexp { display: block; }
.aitem[data-open] .aline { background: var(--panel); }
.aline__x { flex: none; color: var(--fg-3); transition: transform var(--dur) var(--ease); }
.aitem[data-open] .aline__x { transform: rotate(90deg); }

/* --- kejadian tunggal di dalam kelompok yang terbuka --- */
.akid { display: flex; align-items: center; gap: 0.4rem; padding: 0.24rem 0; font-size: var(--fs-2xs); }

/* Susunan graph dipakai dua kali: kanvas penuh dan pita ringkas. */
const NODE_W = 168, NODE_H = 52;

function graphNodes(g, opts) {
  const bloomIdx = opts && opts.bloom !== undefined ? opts.bloom : -1;
  const shiftFrom = bloomIdx >= 0 ? g.nodes[bloomIdx].x : Infinity;
  const dx = function (n) { return n.x > shiftFrom ? n.x + 232 : n.x; };
  return { dx: dx, bloomIdx: bloomIdx };
}

function graphCanvas(g, opts) {
  const o = graphNodes(g, opts);
  const width = Math.max.apply(null, g.nodes.map(function (n) { return o.dx(n) + NODE_W; })) + (opts && opts.extraW ? opts.extraW : 40);
  const height = Math.max.apply(null, g.nodes.map(function (n) { return n.y + NODE_H; })) + 40;

  const edges = g.edges.map(function (e) {
    const a = g.nodes[e[0]], b = g.nodes[e[1]];
    const aw = e[0] === o.bloomIdx ? 400 : NODE_W;
    const x1 = o.dx(a) + aw, y1 = a.y + NODE_H / 2, x2 = o.dx(b), y2 = b.y + NODE_H / 2, mx = (x1 + x2) / 2;
    return '<path d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" fill="none" stroke="var(--border-2)" stroke-width="1.4"/>';
  }).join('');

  const nodes = g.nodes.map(function (n, i) {
    if (opts.hide !== undefined && i === opts.hide) return '';
    if (i === o.bloomIdx && opts.question) {
      const q = opts.question;
      return '<article class="node node--bloom" style="left:' + o.dx(n) + 'px;top:' + n.y + 'px">' +
        '<div class="node__hd">' + mark(n.status, 15) + '<span class="node__key">' + esc(n.key) + '</span>' +
        '<span class="sp"></span><span class="chip chip--wait">' + KIND_LABEL[q.kind] + '</span></div>' +
        '<div class="node__meta">' + turnLong(q.turn, q.attempt) + ' · menunggu ' + age(q.ageMin) +
        (q.byHand ? ' · <span style="color:var(--attention)">ditulis manusia</span>' : '') + '</div>' +
        '<p class="bloom__ask">' + esc(q.body) + '</p>' + qControl(q) + '</article>';
    }
    return '<div class="node" style="left:' + o.dx(n) + 'px;top:' + n.y + 'px"' + (n.live ? ' data-live="' + n.live + '"' : '') + '>' +
      '<div class="node__hd">' + mark(n.status, 14) + '<span class="node__key">' + esc(n.key) + '</span></div>' +
      '<div class="node__meta">' + esc(n.meta) + '</div></div>';
  }).join('');

  const fan = g.fan && o.bloomIdx < 0
    ? '<div class="fanbox" style="left:' + g.fan.x + 'px;top:' + g.fan.y + 'px;width:' + g.fan.w + 'px;height:' + g.fan.h + 'px"><span class="fanbox__label">' + esc(g.fan.label) + '</span></div>'
    : '';

  return { width: width, height: height, html: fan + '<svg class="k__edges" aria-hidden="true">' + edges + '</svg>' + nodes, dx: o.dx };
}

function graphHead(g, extra) {
  return '<div class="k__graphhd">' +
    '<div class="sp" style="min-width:0">' +
      '<div class="k__crumb">' + icon('folder', 12) + '<span class="trunc">' + esc(g.crumb) + '</span></div>' +
      '<h1 class="k__gtitle">' + esc(g.title) + '</h1>' +
    '</div>' +
    '<div class="seg"><button type="button" aria-pressed="true">Graph</button><button type="button" aria-pressed="false">Log</button><button type="button" aria-pressed="false">Artefak</button></div>' +
    (extra || '<button class="btn btn--sm" type="button">Batalkan Run</button>') +
  '</div>';
}

function graphPane(s, opts) {
  const g = GRAPHS[s.graph];
  const c = graphCanvas(g, opts || {});
  return graphHead(g, opts && opts.headExtra) +
    '<div class="k__canvas"><div class="k__dots"></div>' +

}

/* Node mana yang sedang menunggu manusia — tempat pertanyaan bersandar. */
function waitingNodeIndex(g) {
  for (let i = 0; i < g.nodes.length; i++) if (g.nodes[i].status === 'awaiting-human') return i;
  return -1;
}

function restLine(s) {

/* --- f3 · Lengket ------------------------------------------------------ */
function f3(s) {
  const q = s.questions[0];
  const g = GRAPHS[s.graph];
  const wi = waitingNodeIndex(g);
  const wn = g.nodes[wi >= 0 ? wi : 0];
  const sheetX = wn.x + NODE_W + 96;
  const sheetY = Math.max(0, wn.y - 16);
  const c = graphCanvas(g, { extraW: 520 });
  const connector = '<svg class="k__edges" aria-hidden="true" style="z-index:3">' +
    '<path d="M' + (wn.x + NODE_W) + ' ' + (wn.y + NODE_H / 2) + ' C' + (wn.x + NODE_W + 48) + ' ' + (wn.y + NODE_H / 2) + ', ' +
    (sheetX - 48) + ' ' + (sheetY + 40) + ', ' + sheetX + ' ' + (sheetY + 40) + '" fill="none" ' +
    'stroke="color-mix(in srgb, var(--warning) 55%, var(--border))" stroke-width="1.6" stroke-dasharray="4 3"/></svg>';
  const sheet = '<article class="sheet" style="left:' + sheetX + 'px;top:' + sheetY + 'px">' +
    '<div class="sheet__hd">' + qMeta(q) + '</div>' +
    '<h2 class="sheet__ask">' + esc(q.body) + '</h2>' + qControl(q) +
    '<div class="sheet__more">' + icon('inbox', 13) + restLine(s) + '</div></article>';
  return '<div class="ctr">' + graphHead(g, '<button class="btn btn--sm" type="button">Batalkan Run</button>') +
    '<div class="k__canvas"><div class="k__dots"></div>' +
    '<div class="k__graph" style="width:' + Math.max(c.width, sheetX + 440) + 'px;min-height:' + Math.max(c.height, sheetY + 380) + 'px">' +
    c.html + connector + sheet + '</div></div></div>';
}

/* --- f4 · Peta --------------------------------------------------------- */
function minimap(g, q) {
  const cols = [];
  g.nodes.forEach(function (n, i) {
    let col = cols.find(function (x) { return x.x === n.x; });
    if (!col) { col = { x: n.x, items: [] }; cols.push(col); }
    col.items.push({ n: n, i: i });
  });
  cols.sort(function (a, b) { return a.x - b.x; });
  return cols.map(function (col, ci) {
    const chips = col.items.length > 2
      ? '<span class="mmchip">' + mark(col.items[0].n.status, 13) + esc(col.items[0].n.key) + '<span class="mmchip__n">×' + col.items.length + '</span></span>'
      : col.items.map(function (it) {
          const here = it.n.status === 'awaiting-human';
          return '<span class="mmchip" data-here="' + here + '">' + mark(it.n.status, 13) + esc(it.n.key) + '</span>';
        }).join('');
    return (ci > 0 ? '<span class="mmlink"></span>' : '') + '<span class="mmcol">' + chips + '</span>';
  }).join('');
}

function f4(s) {
  const q = s.questions[0];
  const g = GRAPHS[s.graph];
  return '<div class="ctr">' +

    '</div>' +
    '<div class="focus"><div class="focus__wrap">' +

/* Tidak ada yang menunggu: kelima varian jatuh ke graph penuh yang sama.
   Perbedaan kelimanya hanya ada saat ada Question — jadi jangan menilai
   keadaan Tenang, di sana mereka memang identik. */
function withCentre(fn) {
  return function (s) {
    if (s.questions.length === 0) return shell(s, '<div class="ctr">' + graphPane(s) + '</div>');
    return shell(s, fn(s));
  };
}

/* ==========================================================================

   dan membawa sisa antrean. Graph, nav, rail, dan qControl dipegang tetap.
   ========================================================================== */

/* Titik sandar: node awaiting-human dan sisi kanannya dalam ruang graph. */
function anchor(g) {
  const i = waitingNodeIndex(g);
  const n = g.nodes[i >= 0 ? i : 0];
  return { node: n, x: n.x + NODE_W, y: n.y + NODE_H / 2, key: n.key };
}

function connector(x1, y1, x2, y2) {
  const mx = (x1 + x2) / 2;
  return '<path d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" ' +
    'fill="none" stroke="color-mix(in srgb, var(--warning) 55%, var(--border))" stroke-width="1.6" stroke-dasharray="4 3"/>';
}

function sheetInner(q, s, extraTop) {
  return (extraTop || '') +
    '<div class="sheet__hd">' + qMeta(q) + '</div>' +
    '<h2 class="sheet__ask">' + esc(q.body) + '</h2>' + qControl(q) +
    '<div class="sheet__more">' + icon('inbox', 13) + restLine(s) + '</div>';
}

function canvasShell(g, inner, w, h) {
  return '<div class="k__canvas" id="kanvas"><div class="k__dots"></div>' +
    '<div class="k__graph" id="graf" style="width:' + w + 'px;min-height:' + h + 'px">' + inner + '</div></div>';
}

/* Menjaga sheet tetap dalam pandangan dan menggambar ulang talinya. */
function wireFollow() {
  const kanvas = document.getElementById('kanvas');
  const sheet = document.getElementById('sheet');
  const tali = document.getElementById('tali');
  if (!kanvas || !sheet || !tali) return;
  const ax = Number(sheet.dataset.ax), ay = Number(sheet.dataset.ay);
  const x0 = Number(sheet.dataset.x0), y0 = Number(sheet.dataset.y0);
  const draw = function () {
    const x = Math.max(x0, kanvas.scrollLeft + kanvas.clientWidth - sheet.offsetWidth - 24);
    const y = Math.max(y0, kanvas.scrollTop + 24);
    sheet.style.left = x + 'px';
    sheet.style.top = y + 'px';
    tali.innerHTML = connector(ax, ay, x, y + 40);
  };
  kanvas.addEventListener('scroll', draw, { passive: true });
  draw();
}

    sheetInner(q, s, bar) + '</article>';

}

    return '<div class="q__ctl q__ctl--eff">' + q.options.map(function (o, i) {
      return '<button class="effbtn" type="button"><span class="q__radio" style="margin-top:0.3rem"></span>' +

      '<div class="q__ctl"><button class="btn btn--primary btn--sm" type="button">Kirim jawaban</button>' + eff(EFFECT[q.id]) + '</div>';
  }

/* Kind mana yang ditaruh di depan — supaya sistemnya bisa dinilai utuh. */
let kindKey = 'edit-artifact';
function focusKind(s) {
  if (s.questions.length === 0) return s;
  const hit = s.questions.filter(function (q) { return q.kind === kindKey; });
  if (hit.length === 0) return s;
  const rest = s.questions.filter(function (q) { return q.kind !== kindKey; });
  return Object.assign({}, s, { questions: hit.concat(rest) });
}

   PITA ALARM — hasil ronde 9 sampai 12, tidak ada varian yang tersisa.

/* Kejadian tunggal — satu hal yang salah, belum dikelompokkan. Semua
   pengelompokan di bawah dibangun dari daftar yang sama ini.
     kind  jenisnya    t/f/d  judul, fakta ringkas, keterangan penuh     */
function alarmEvents(s) {
  const out = [];

  s.runners.filter(function (r) { return r.down; }).forEach(function (r) {
    out.push({ sev: 'fail', ico: 'server', kind: 'runner-hilang',
      t: r.id + ' hilang', f: age(r.hb),
      d: 'heartbeat terakhir ' + age(r.hb) + ' lalu · ' + r.slots + ' slot ikut hilang' });
  });

  s.runs.filter(function (r) { return r.status === 'failed' || r.status === 'unschedulable'; }).forEach(function (r) {
    const stuck = r.status === 'unschedulable';
    out.push({ sev: 'fail', ico: 'alert', kind: stuck ? 'run-kedaluwarsa' : 'run-gagal',
      t: r.project + ' · ' + r.path.replace('.factory/pipelines/', '').replace('.yaml', ''),
      f: stuck ? 'kedaluwarsa' : 'attempt ' + r.attempt,
      d: (stuck ? 'Tidak ada runner yang memenuhi label' : 'Gagal di ' + turnLong(r.turn, r.attempt)) +
        ' · <code>' + esc(r.id) + '</code> · ' + age(r.ageMin) + ' lalu' });
  });

  s.skips.forEach(function (k) {
    out.push({ sev: 'warn', ico: 'clock', kind: 'cron-dilewati',
      t: k.name + ' dilewati ' + k.n + '×', f: 'cron',
      d: k.why + ' · jadwal berikutnya tetap dicoba' });
  });

  s.runners.filter(function (r) { return r.state === 'revoked'; }).forEach(function (r) {
    out.push({ sev: 'warn', ico: 'server', kind: 'runner-dicabut',
      t: r.id + ' dicabut', f: '−' + r.slots + ' slot',
      d: 'slot-nya sudah tidak dihitung dalam kapasitas' });
  });

  s.questions.filter(function (q) { return q.ageMin > 1440; }).forEach(function (q) {
    out.push({ sev: 'warn', ico: 'hand', kind: 'question-menua',
      t: q.project + ' · ' + q.step, f: age(q.ageMin),
      d: 'menunggu ' + age(q.ageMin) + ' · Run-nya berhenti selama itu' });
  });

  return out;
}

const KIND_HEAD = {
  'runner-hilang': ['runner hilang', 'server'],
  'run-gagal': ['Run gagal', 'alert'],
  'run-kedaluwarsa': ['Run kedaluwarsa', 'alert'],
  'cron-dilewati': ['cron dilewati', 'clock'],
  'runner-dicabut': ['runner dicabut', 'server'],
  'question-menua': ['Question menua', 'hand'],
};

/* Membangun kelompok dari kejadian. `key` menentukan apa yang dianggap satu
   alarm; `head` menamai kelompoknya. Kelompok berisi satu kejadian tetap
   dibiarkan utuh supaya tidak ada baris "1 Run gagal" yang konyol. */
function groupEvents(events, key, head) {
  const order = [];
  const bins = {};
  events.forEach(function (e) {
    const k = key(e);
    if (!bins[k]) { bins[k] = []; order.push(k); }
    bins[k].push(e);
  });
  return order.map(function (k) {
    const items = bins[k];
    if (items.length === 1) return Object.assign({}, items[0], { items: [] });
    const h = head(k, items);
    return {
      sev: items.some(function (e) { return e.sev === 'fail'; }) ? 'fail' : 'warn',
      ico: h.ico, t: h.t, f: items.length + ' hal',
      d: '', items: items,
    };
  });
}

function sevColor(a) { return 'var(--' + (a.sev === 'fail' ? 'destructive' : 'warning') + ')'; }
function alarmIcon(a, size) { return '<span style="color:' + sevColor(a) + '">' + icon(a.ico, size || 14) + '</span>'; }

/* Bentuk baris dibekukan di ronde 11: ringkas, bisa dibuka di tempat. */
function alarmItem(a, open) {
  const body = a.items && a.items.length
    ? a.items.map(function (e) {
        return '<div class="akid">' + alarmIcon(e, 12) +
          '<span class="akid__t">' + esc(e.t) + '</span>' +
          '<span class="akid__f">' + esc(e.f) + '</span></div>';
      }).join('')
    : a.d;
  return '<div class="aitem" data-sev="' + a.sev + '"' + (open ? ' data-open=""' : '') + '>' +
    '<button class="aline" type="button">' + alarmIcon(a) +
    '<span class="aline__t">' + esc(a.t) + '</span>' +
    '<span class="aline__f">' + esc(a.f) + '</span>' +
    '<span class="aline__x">' + icon('arrow', 12) + '</span></button>' +
    '<div class="aexp">' + body + '</div></div>';
}

function railtop(count, inner) {
  return '<div class="railtop">' +
    '<div class="railtop__hd">' + icon('alert', 13) + 'Perlu ditengok · ' + count + '</div>' +
    inner + '</div>';
}

/* Pita alarm, dibekukan di ronde 12: dikelompokkan per jenis, dibuka di
   tempat, isinya kejadian bernama lengkap. Tanpa kejadian, pita tidak ada. */
function railAlarms(s) {
  const events = alarmEvents(s);
  if (events.length === 0) return railPanels(s);
  const groups = groupEvents(events, function (e) { return e.kind; }, function (k, items) {
    const h = KIND_HEAD[k];
    return { t: items.length + ' ' + h[0], ico: h[1] };
  });
  return railtop(groups.length, groups.map(function (g, i) { return alarmItem(g, i === 0); }).join('')) +
    railPanels(s);
}

/* Baris benar-benar bisa dibuka — ronde 11 memilih perilaku ini, jadi
   tiruan yang mati akan menyesatkan penilaian. */
function wireRail() {
  wireFollow();
  const rail = document.querySelector('.k__rail');
  if (!rail) return;
  rail.addEventListener('click', function (e) {
    const line = e.target.closest ? e.target.closest('.aline') : null;
    if (!line) return;
    const item = line.parentElement;
    if (item.hasAttribute('data-open')) item.removeAttribute('data-open');
    else item.setAttribute('data-open', '');
  });
}

  b.addEventListener('click', function () {
    themeKey = t.key;
    if (t.key === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t.key);
    Array.prototype.forEach.call(pkTheme.children, function (x, i) { x.setAttribute('aria-pressed', String(THEMES[i].key === themeKey)); });
  });
  pkTheme.appendChild(b);
});

document.addEventListener('keydown', function (e) {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { current = (current + 1) % DESIGNS.length; render(); }
  else if (e.key === 'ArrowLeft') { current = (current - 1 + DESIGNS.length) % DESIGNS.length; render(); }
  else if (e.key >= '1' && e.key <= '9' && Number(e.key) <= DESIGNS.length) { current = Number(e.key) - 1; render(); }
  else if (e.key === 's' || e.key === 'S') { stateKey = STATE_KEYS[(STATE_KEYS.indexOf(stateKey) + 1) % STATE_KEYS.length]; render(); }
  else if (e.key === 'k' || e.key === 'K') { kindKey = KIND_KEYS[(KIND_KEYS.indexOf(kindKey) + 1) % KIND_KEYS.length]; render(); }
});

const picker = document.getElementById('picker');
const pkToggle = document.getElementById('pk-toggle');
pkToggle.addEventListener('click', function () {
  const collapsed = picker.getAttribute('data-collapsed') === 'true';
  picker.setAttribute('data-collapsed', String(!collapsed));
  pkToggle.setAttribute('aria-expanded', String(collapsed));
  pkToggle.style.transform = collapsed ? '' : 'rotate(180deg)';
});

(function () {
  const grab = document.getElementById('pk-grab');
  let dragging = false, ox = 0, oy = 0;
  grab.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    dragging = true;
    const r = picker.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    picker.style.right = 'auto'; picker.style.bottom = 'auto';
    picker.style.left = r.left + 'px'; picker.style.top = r.top + 'px';
    grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    const x = Math.min(Math.max(0, e.clientX - ox), window.innerWidth - picker.offsetWidth);
    const y = Math.min(Math.max(0, e.clientY - oy), window.innerHeight - picker.offsetHeight);
    picker.style.left = x + 'px'; picker.style.top = y + 'px';
  });
  grab.addEventListener('pointerup', function (e) { dragging = false; grab.releasePointerCapture(e.pointerId); });
})();

render();
</script>
</body>
